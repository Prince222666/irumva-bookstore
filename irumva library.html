<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRUMVA Book Store | Login</title>
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #111111;
            --text-light: #ffffff;
            --primary-red: #ff3131;
            --success-green: #00ff41;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* --- LOGIN OVERLAY --- */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: 0.5s;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--primary-red);
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 49, 49, 0.2);
        }

        .login-box h2 { color: var(--primary-red); margin-bottom: 20px; }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login-box input:focus { border-color: var(--success-green); outline: none; }

        .login-btn {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
        }

        .toggle-link {
            color: var(--success-green);
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
            display: block;
        }

        /* --- BOOKSTORE CONTENT (Hidden initially) --- */
        #main-content {
            display: none;
        }

        header {
            background-color: #000;
            border-bottom: 3px solid var(--primary-red);
            padding: 2rem 1rem;
            text-align: center;
        }

        .search-container {
            margin: 20px auto;
            max-width: 600px;
            display: flex;
            padding: 0 1rem;
        }

        #bookSearch {
            flex-grow: 1;
            padding: 12px;
            border-radius: 5px;
            border: 2px solid var(--success-green);
            background: #222;
            color: white;
        }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            transition: 0.3s;
        }

        .book-card:hover { border-color: var(--success-green); transform: scale(1.05); }

        .book-cover {
            height: 200px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 3px solid var(--primary-red);
            margin-bottom: 10px;
        }

        .book-price { color: var(--success-green); font-size: 1.2rem; font-weight: bold; margin: 10px; }

        .buy-btn {
            background: var(--success-green);
            color: black;
            font-weight: bold;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box" id="auth-form">
        <h2 id="form-title">LOGIN</h2>
        <input type="text" placeholder="Username" id="user">
        <input type="password" placeholder="Password" id="pass">
        <button class="login-btn" onclick="enterStore()">ENTER STORE</button>
        <span class="toggle-link" onclick="toggleAuth()">New here? Sign Up</span>
    </div>
</div>

<div id="main-content">
    <header>
        <h1 style="color:var(--primary-red)">IRUMVA BOOK STORE</h1>
        <div class="search-container">
            <input type="text" id="bookSearch" placeholder="Search 100+ titles..." onkeyup="filterBooks()">
        </div>
    </header>

    <div class="container">
        <div id="book-container" class="book-grid"></div>
    </div>
</div>

<script>
    // Toggle between Login and Sign Up
    let isLogin = true;
    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "LOGIN" : "SIGN UP";
        document.querySelector('.toggle-link').innerText = isLogin ? "New here? Sign Up" : "Already have an account? Login";
    }

    // Hide Login and Show Store
    function enterStore() {
        const user = document.getElementById('user').value;
        if(user === "") {
            alert("Please enter a username");
            return;
        }
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    }

    // Generate 100 Books
    const bookContainer = document.getElementById('book-container');
    const adjs = ["Red", "Black", "Dark", "Ancient", "Secret", "Lost", "Final", "Green", "Hidden", "Silent"];
    const nouns = ["Soul", "Warrior", "Legend", "Legacy", "Code", "Empire", "Path", "Night", "History", "King"];

    for (let i = 1; i <= 100; i++) {
        const title = adjs[Math.floor(Math.random() * adjs.length)] + " " + 
                      nouns[Math.floor(Math.random() * nouns.length)] + " Vol. " + i;
        const price = (Math.random() * (45 - 12) + 12).toFixed(2);
        
        bookContainer.innerHTML += `
            <div class="book-card">
                <div class="book-cover">??</div>
                <div class="book-title">${title}</div>
                <div class="book-price">$${price}</div>
                <button class="buy-btn" onclick="alert('Added to cart!')">ADD TO CART</button>
            </div>
        `;
    }

    // Search Logic
    function filterBooks() {
        const input = document.getElementById('bookSearch').value.toLowerCase();
        const cards = document.getElementsByClassName('book-card');
        for (let card of cards) {
            const title = card.querySelector('.book-title').innerText.toLowerCase();
            card.style.display = title.includes(input) ? "block" : "none";
        }
    }
</script>

</body>
</html>
